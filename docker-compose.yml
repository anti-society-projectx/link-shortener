services:

  backend:

    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: link_backend

    restart: always

    env_file:
      - .env

    volumes:
      - ./data:/data
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"



  telegram_bot:

    build:
      context: .
      dockerfile: telegram_bot/Dockerfile

    container_name: link_bot

    restart: always

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy



  postgres:

    image: postgres:18

    container_name: link_postgres

    restart: always

    env_file:
      - .env


    environment:

      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__DB}


    volumes:

      - postgres_data:/var/lib/postgresql


    ports:

      - "5432:5432"


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB__USER}"
        ]

      interval: 5s

      timeout: 5s

      retries: 20



volumes:

  postgres_data: